# The tap's only promise: `brew install elegant-atomics/tap/gtme` works on
# a machine that has never seen gtme. Both runners start clean.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master
      - name: tap this checkout
        run: brew tap elegant-atomics/tap "$PWD"
      - name: install
        run: brew install elegant-atomics/tap/gtme
      - name: test
        run: brew test elegant-atomics/tap/gtme
      - name: audit
        run: brew audit --strict elegant-atomics/tap/gtme
      - name: version
        run: gtme version
